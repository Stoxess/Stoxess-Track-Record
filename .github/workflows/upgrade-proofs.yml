name: Upgrade timestamp proofs

# Each anchor is first stamped as "pending" with the OpenTimestamps calendars.
# Within hours the calendars have it in a Bitcoin block; this job fetches the
# completed proofs so each .ots file stands on its own without the calendars.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client
      - name: Upgrade pending proofs
        run: |
          shopt -s globstar nullglob
          for f in anchors/**/*.ots; do
            ots upgrade "$f" || true
            rm -f "$f.bak"
          done
      - name: Commit upgraded proofs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "track-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git add anchors
            git commit -m "upgrade timestamp proofs"
            git push
          fi
